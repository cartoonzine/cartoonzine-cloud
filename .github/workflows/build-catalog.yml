# Reconstrói o catálogo automaticamente e publica no próprio repositório.
# O site (GitHub Pages / Cloudflare Pages / Netlify) passa a servir /catalog.
name: Build do catálogo

on:
  schedule:
    - cron: "0 */6 * * *"      # a cada 6 horas
  workflow_dispatch:            # botão "Run workflow" manual
  push:
    paths:
      - sources.json
      - catalog-core.js
      - tools/build-catalog.mjs

permissions:
  contents: write

concurrency:
  group: build-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Gerar catálogo
        run: |
          node --max-old-space-size=6144 tools/build-catalog.mjs \
            --sources sources.json --out catalog \
            --check-streams --check-limit 3000

      # Trava: se o script de build não gerou um manifest NOVO, o job falha (fica vermelho)
      # em vez de terminar em "Nada mudou." sem ninguém perceber.
      - name: Conferir se o catálogo foi gerado
        run: |
          node -e '
            const m = require("./catalog/manifest.json");
            const idadeMin = (Date.now() - Date.parse(m.generatedAt)) / 60000;
            console.log("Catálogo:", m.totals.itens, "itens,", m.totals.series, "séries,", m.totals.categorias, "categorias — gerado há", idadeMin.toFixed(1), "min");
            if (!(idadeMin < 90)) { console.error("::error::O build não gerou catálogo novo (manifest de " + m.generatedAt + "). Confira tools/build-catalog.mjs."); process.exit(1); }
          '

      - name: Publicar se mudou
        run: |
          git config user.name  "cartoonzine-bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalog health-cache.json
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "catálogo: atualização automática"
            # Se alguém editou o repositório durante o build, a main andou:
            # traz as mudanças (o robô só mexe em catalog/ e health-cache.json) e tenta de novo.
            for tentativa in 1 2 3; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
              git rebase --abort 2>/dev/null || true
              echo "Push recusado (tentativa $tentativa), tentando de novo..."
              sleep $((tentativa * 5))
            done
            exit 1
          fi
